[project]
name = "dagster-mcp"
version = "0.12.0"
description = "MCP server that wraps the Dagster GraphQL API — manage runs, assets, schedules, sensors, and backfills from any MCP client"
license = {text = "MIT"}
keywords = ["mcp", "dagster", "graphql", "data-pipelines", "orchestration"]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/fabdendev/dagster-mcp"
Repository = "https://github.com/fabdendev/dagster-mcp"
Issues = "https://github.com/fabdendev/dagster-mcp/issues"

[project.scripts]
dagster-mcp = "dagster_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dagster_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
# Selected explicitly rather than relying on ruff's defaults, which change
# between releases: a new ruff should not fail CI on code nobody touched.
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "B", "BLE"]
# TRY004 is deliberately absent. It asks for TypeError when an isinstance check
# fails, but the malformed values here arrive from Dagster over the network
# rather than from a caller, and RuntimeError with a diagnostic message is this
# project's error contract.
